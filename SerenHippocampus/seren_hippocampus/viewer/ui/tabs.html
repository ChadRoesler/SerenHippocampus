<!-- Shell contract: class="tab" data-tab="<view id>", onclick showTab(). The
     shell underlines the active one and activates the first on load. -->
<button class="tab" data-tab="overview" onclick="showTab('overview')">Overview</button>
<button class="tab" data-tab="sleep" onclick="showTab('sleep')">Last sleep</button>
<button class="tab" data-tab="queue" onclick="showTab('queue')">Waiting for review</button>
<button class="tab" data-tab="history" onclick="showTab('history')">History</button>
<button class="tab" data-tab="audit" onclick="showTab('audit')">Audit</button>
